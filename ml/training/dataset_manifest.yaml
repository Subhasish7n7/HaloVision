# ============================================================
# SECTION 3: CLASS AMBIGUITY ANALYSIS
# ============================================================

ambiguity_issues:
  - id: 87
    class: staircase
    issue: "Open Images V7 has 'Stairs' (ID 489), not 'staircase'"
    resolution: "RENAME to 'stairs' for consistency with Open Images V7"
    action_required: true

  - id: 81
    class: walking_cane
    issue: "Open Images V7 has no 'walking cane' class. Roboflow has 'white_cane' datasets."
    resolution: "RENAME to 'white_cane' to match available dataset terminology"
    action_required: true

  - id: 83
    class: guide_dog
    issue: "No public dataset specifically for guide dogs. COCO has 'dog' (16). Guide dogs wear harnesses/vests."
    resolution: "Keep as 'guide_dog'. Custom phone-camera images STRONGLY recommended. Must distinguish from ordinary dogs."
    action_required: false
    definition: "A dog wearing a harness, vest, or leading a person. NOT just any dog."

  - id: 90
    class: door
    issue: "Open Images V7 has 'Door' (164). But 'door' vs 'entrance' can be ambiguous."
    resolution: "Keep as 'door'. Define: physical door panel/gate. NOT entrance/exit signage."
    action_required: false
    definition: "The physical door panel, gate, or entryway structure itself."

  - id: 91
    class: entrance
    issue: "No direct Open Images V7 match. Visually similar to 'door' and 'exit'."
    resolution: "Keep as 'entrance'. Custom phone-camera images required. Must show entrance signage or architectural cues."
    action_required: false
    definition: "An entrance marked by signage, archway, or architectural features indicating entry point."

  - id: 92
    class: exit
    issue: "No direct Open Images V7 match. Visually similar to 'entrance'."
    resolution: "Keep as 'exit'. Custom phone-camera images required. Must show exit signage."
    action_required: false
    definition: "An exit marked by EXIT signage, emergency exit features, or architectural cues."

  - id: 84
    class: crosswalk
    issue: "Open Images V7 has no 'crosswalk'. Roboflow has crosswalk datasets. Ambiguity: crosswalk markings vs entire pedestrian crossing area."
    resolution: "Keep as 'crosswalk'. Define: painted crosswalk markings on road surface."
    action_required: false
    definition: "The painted zebra stripes or crosswalk markings on the road surface."

  - id: 93
    class: bollard
    issue: "Open Images V7 has no 'bollard'. Roboflow has bollard datasets. Overlaps with 'road_barrier'."
    resolution: "Keep as 'bollard'. Define: short vertical post. 'road_barrier' is larger horizontal barrier."
    action_required: false
    definition: "A short, sturdy vertical post (metal/concrete) used to control traffic or protect pedestrians."

  - id: 94
    class: road_barrier
    issue: "Open Images V7 has no 'road_barrier'. Overlaps with 'bollard'."
    resolution: "Keep as 'road_barrier'. Define: larger horizontal barrier (jersey barrier, guardrail, construction barrier)."
    action_required: false
    definition: "A larger horizontal barrier (jersey barrier, guardrail, construction barrier, traffic cone wall)."

  - id: 85
    class: curb
    issue: "Open Images V7 has no 'curb'. OOD dataset has curb class. Visually subtle."
    resolution: "Keep as 'curb'. Custom phone-camera images recommended for diverse curb styles."
    action_required: false
    definition: "The raised edge between road and sidewalk/pavement."


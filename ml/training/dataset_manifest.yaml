# ============================================================
# SECTION 6: DOWNLOAD COMMANDS (DO NOT EXECUTE YET)
# ============================================================

# Step 1: Download COCO 2017 for baseline preservation
# This is REQUIRED to prevent catastrophic forgetting
coco_download:
  command: |
    # Download COCO 2017 train/val from official source
    # http://images.cocodataset.org/zips/train2017.zip (18GB)
    # http://images.cocodataset.org/zips/val2017.zip (1GB)
    # http://images.cocodataset.org/annotations/annotations_trainval2017.zip (241MB)
  notes: "Required for baseline preservation. ~19GB total."

# Step 2: Download Open Images V7 filtered classes
open_images_download:
  method: "Ultralytics fiftyone script (filtered to our 4 classes only)"
  command: |
    # Use fiftyone to download only the classes we need
    # This avoids downloading the full 561GB dataset
    python -c "
    import fiftyone as fo
    import fiftyone.zoo as foz
    dataset = foz.load_zoo_dataset(
        'open-images-v7',
        split='train',
        label_types=['detections'],
        classes=['Wheelchair', 'Crutch', 'Stairs', 'Door'],
        max_samples=2000,
    )
    dataset.export(
        export_dir='ml/training/datasets/halovision_v2/open_images',
        dataset_type=fo.types.YOLOv5Dataset,
        label_field='ground_truth',
        classes=['Wheelchair', 'Crutch', 'Stairs', 'Door'],
    )
    "
  notes: "Filtered download. ~50GB estimated for 4 classes."

# Step 3: Download Roboflow datasets
roboflow_download:
  datasets:
    - url: "https://universe.roboflow.com/mobilityaids/wheelchair-detection-hh3io"
      format: "YOLOv8"
    - url: "https://universe.roboflow.com/nodongjaeteam-g1pbo/white-cane-hyjat"
      format: "YOLOv8"
    - url: "https://universe.roboflow.com/mbdetector/mobility-aid-detector-mwxuw"
      format: "YOLOv8"
    - url: "https://universe.roboflow.com/esera/bollards-crosswalk-stairs"
      format: "YOLOv8"
    - url: "https://universe.roboflow.com/aegis/pothole-detection-i00zy"
      format: "YOLOv8"
    - url: "https://universe.roboflow.com/fpn/ood-pbnro"
      format: "YOLOv8"
    - url: "https://universe.roboflow.com/mallescalatorsystem"
      format: "YOLOv8"
  notes: "Download each, filter to needed classes, convert to our class IDs."

# Step 4: Custom phone-camera capture
custom_capture:
  classes: ["guide_dog", "entrance", "exit", "road_barrier", "curb"]
  min_per_class: 50
  target_per_class: 300
  tool: "LabelImg or CVAT"
  format: "YOLO txt (class_id cx cy w h)"


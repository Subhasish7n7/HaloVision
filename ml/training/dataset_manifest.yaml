# ---------------------------------------------------------------------------
# FINAL CLASS MAPPING (95 classes) — IDs are FROZEN. Do not change.
# Verified 2026-09-24: existing halovision_v2.yaml 0-79 names match the
# standard COCO-to-YOLO 80-class order exactly (person=0 ... toothbrush=79),
# derived from instances_train2017.json categories sorted by COCO category id
# (sparse ids 1..90, 80 valid) mapped in order to 0..79. No discrepancy found.
# ---------------------------------------------------------------------------
class_mapping:
  coco_baseline:
    range: "0-79"
    count: 80
    mapping_rule: "sorted(instances*.json categories by COCO id) -> index 0..79"
    verified: true
    verified_on: "2026-09-24"
    verified_against:
      - "ml/training/datasets/halovision_v2/halovision_v2.yaml"
      - "sources/coco2017/annotations/instances_train2017.json (80 categories, ids 1..90 sparse)"
      - "sampled 30000 converted labels: class ids only 0..79, 0 malformed lines"
  new_classes:
    80: wheelchair
    81: white_cane
    82: crutches
    83: guide_dog
    84: crosswalk
    85: curb
    86: pothole
    87: stairs
    88: escalator
    89: elevator
    90: door
    91: entrance
    92: exit
    93: bollard
    94: road_barrier
  renames_applied:
    walking_cane: white_cane
    staircase: stairs
  annotation_definitions:
    white_cane: >
      Only mobility/white canes used by blind or low-vision people for
      navigation may be labeled. Do NOT label random sticks, hiking poles,
      umbrellas, walking sticks, brooms, or other long thin objects.
    stairs: >
      A fixed flight of steps (indoor or outdoor). Label the whole step
      flight as one box. Keep strictly separate from escalators (88) and
      elevators (89). Do not label a single step, a ladder, or a ramp.
    guide_dog: >
      A dog wearing a harness/vesti indicating guide/mobility-assist role.
      Plain pet dogs are class 16 (dog), not guide_dog.
    entrance: >
      An identifiable building/room entrance (doorway or open entry point
      viewed as a passage into a structure). Distinct from door (90, the
      physical door panel/leaf) and exit (92, egress signage/doorway).
    exit: >
      Egress doorway or EXIT-sign-marked opening. Distinct from entrance (91).
    crosswalk: >
      Marked pedestrian crossing on a road (zebra stripes or painted lines).
    curb: >
      Raised road-edge kerb/curb line separating road from pavement.
    bollard: >
      Short, sturdy, vertical posts used to control traffic/guard pedestrians.
    road_barrier: >
      Horizontal/temporary barrier across or along a road (guard rail,
      temporary construction barrier, crossing gate arm). Distinct from
      bollard (93, free-standing vertical post).

